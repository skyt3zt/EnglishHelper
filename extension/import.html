<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WordCatcher - 隐藏导入工具</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 40px; color: #1f2937; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h1 { margin-top: 0; font-size: 24px; }
    p { color: #6b7280; }
    .file-drop { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: background 0.2s; margin: 20px 0; }
    .file-drop:hover { background: #f8fafc; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 500; cursor: pointer; }
    button:hover { background: #2563eb; }
    #log { margin-top: 20px; font-size: 14px; color: #059669; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤫 隐藏导入页面</h1>
    <p>选择之前导出的 <code>wordcatcher_export.csv</code> 文件来恢复词库数据。</p>
    
    <input type="file" id="fileInput" accept=".csv" style="display: none;">
    <div class="file-drop" id="dropZone">
      点击这里选择 CSV 文件
    </div>
    
    <div style="display:flex; justify-content: space-between; align-items:center;">
        <button id="btn-import">开始导入</button>
        <button id="btn-back" style="background:#6b7280;">返回</button>
    </div>
    <div id="log"></div>
  </div>
  <script src="import.js"></script>
</body>
</html>
